<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NEON DISTRICT — Explore</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#030811;color:white;font-family:system-ui,sans-serif
}
canvas{display:block;touch-action:none}
#hud{
  position:fixed;left:24px;top:22px;
  pointer-events:none;text-shadow:0 2px 10px #000
}
#hud strong{color:#8fffff;letter-spacing:4px;font-size:20px}
#hud small{display:block;color:#bac8d7;margin-top:7px}
#cross{
  position:fixed;left:50%;top:50%;width:4px;height:4px;
  background:#cfffff;border-radius:50%;pointer-events:none
}
#shade{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse,transparent 45%,#0008)
}
#overlay{
  position:fixed;inset:0;display:grid;place-items:center;
  background:#020713b3;backdrop-filter:blur(8px);z-index:5
}
.panel{
  width:min(460px,90vw);padding:32px;border:1px solid #46efff66;
  border-radius:18px;background:#08111de8;text-align:center;
  box-shadow:0 0 70px #00ddff15
}
.tag{font-size:12px;color:#ff75b6;letter-spacing:5px}
h1{font-size:42px;line-height:1.05;letter-spacing:3px;color:#8effff}
p{color:#bdcbd9;line-height:1.9}
button{
  color:#dfffff;border:1px solid #73faff88;background:#103b4c;
  padding:13px 23px;border-radius:9px;font:600 16px system-ui;
  cursor:pointer;touch-action:none
}
button:disabled{opacity:.5;cursor:wait}
#tools{position:fixed;right:16px;top:18px;display:flex;gap:8px}
#tools button{padding:8px 12px;font-size:12px;background:#081725bb}
#touch{
  display:none;position:fixed;bottom:28px;left:22px;
  grid-template-columns:repeat(3,52px);gap:6px
}
#touch button{height:52px;padding:0;background:#0b2839bb}
#touch button[data-key="KeyW"]{grid-column:2}
#touch button[data-key="KeyA"]{grid-column:1}
#lookHint{
  display:none;position:fixed;bottom:45px;right:24px;
  color:#a4cbd8;font-size:12px;pointer-events:none
}
@media(pointer:coarse){
  #touch{display:grid}
  #lookHint{display:block}
  #hud strong{font-size:15px}
  #hud small{font-size:10px}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <strong>NEON DISTRICT</strong>
  <small>SECTOR 07 / RAIN WALK / 02:14 AM</small>
  <small id="position">ตรอกเมืองนีออน</small>
</div>
<div id="cross"></div>
<div id="shade"></div>
<div id="tools">
  <button id="quality">แสง Bloom: เปิด</button>
  <button id="reset">กลับจุดเริ่ม</button>
</div>
<div id="touch">
  <button data-key="KeyW">▲</button>
  <button data-key="KeyA">◀</button>
  <button data-key="KeyS">▼</button>
  <button data-key="KeyD">▶</button>
</div>
<div id="lookHint">ลากบนฉากเพื่อมอง</div>
<div id="overlay">
  <div class="panel">
    <div class="tag">A CYBERPUNK NIGHT WALK</div>
    <h1>NEON<br>DISTRICT</h1>
    <p>ไม่มีภารกิจ ไม่มีเวลาจำกัด<br>แค่เดินหลงเข้าไปในเมืองที่ไม่เคยหลับ</p>
    <p>W A S D — เดิน / เมาส์ — มอง<br>
    Shift — เดินเร็ว / Esc — ปล่อยเมาส์<br>
    มือถือ: ปุ่มลูกศร + ลากหน้าจอ</p>
    <button id="start" disabled>กำลังสร้างเมือง…</button>
    <p id="status" style="font-size:12px">กำลังโหลดระบบ 3D</p>
  </div>
</div>

<script>
window.addEventListener("error", function () {
  const el = document.getElementById("status");
  if (el) el.textContent =
    "โหลดไม่สำเร็จ ลองรีเฟรช และตรวจว่าเครือข่ายอนุญาต jsdelivr.net";
});
</script>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { Reflector } from "three/addons/objects/Reflector.js";

const $ = s => document.querySelector(s);
const mobile = matchMedia("(pointer:coarse)").matches;
const rand = (a,b) => a + Math.random() * (b-a);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#07131d");
scene.fog = new THREE.FogExp2("#102333", .027);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, .1, 180
);
camera.rotation.order = "YXZ";
camera.position.set(0, 1.7, 12);

const renderer = new THREE.WebGLRenderer({
  antialias: !mobile,
  powerPreference: "high-performance"
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1 : 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), .65, .5, 1
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight("#8caed4", "#101021", 1.25));
const moon = new THREE.DirectionalLight("#739bb9", 1.8);
moon.position.set(-12, 35, 8);
scene.add(moon);

const cube = new THREE.BoxGeometry(1,1,1);
const obstacles = [];

function material(color, metalness=.25, roughness=.7) {
  return new THREE.MeshStandardMaterial({color, metalness, roughness});
}
const concrete = material("#17212c");
const dark = material("#090e17");
const steel = material("#293b45", .8, .35);
const sidewalk = material("#293138", .2, .6);
const pink = new THREE.MeshStandardMaterial({
  color:"#ff2b96", emissive:"#ff1680", emissiveIntensity:3
});
const cyan = new THREE.MeshStandardMaterial({
  color:"#27ecff", emissive:"#12dfff", emissiveIntensity:3
});
const amber = new THREE.MeshStandardMaterial({
  color:"#ffc27b", emissive:"#ff9844", emissiveIntensity:2
});

function box(x,y,z,w,h,d,mat,solid=false) {
  const mesh = new THREE.Mesh(cube, mat);
  mesh.position.set(x,y,z);
  mesh.scale.set(w,h,d);
  scene.add(mesh);
  if(solid) obstacles.push({
    x1:x-w/2, x2:x+w/2, z1:z-d/2, z2:z+d/2
  });
  return mesh;
}

function pipe(points, radius=.04, mat=steel) {
  const curve = new THREE.CatmullRomCurve3(
    points.map(p=>new THREE.Vector3(...p))
  );
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve,24,radius,5,false), mat
  );
  scene.add(mesh);
  return mesh;
}

// Dark ground, reflective road and raised-looking sidewalks.
box(0,-.13,-39,45,.2,125,dark);
box(-5.1,-.015,-39,1.8,.16,120,sidewalk);
box(5.1,-.015,-39,1.8,.16,120,sidewalk);

const road = new Reflector(new THREE.PlaneGeometry(8.4,120), {
  clipBias:.003,
  textureWidth:mobile ? 256 : 768,
  textureHeight:mobile ? 256 : 768,
  color:0x343d47
});
road.rotation.x = -Math.PI/2;
road.position.set(0,-.02,-39);
scene.add(road);

// Broken paint, drains and slabs interrupt the smooth reflection.
for(let z=18;z>-98;z-=4) {
  box(-4.1,.012,z,.06,.016,1.5,amber);
  box(4.1,.012,z,.06,.016,1.5,amber);
  box(0,-.005,z,8,.012,.045,dark);
}
for(let z=9;z>-95;z-=12) {
  box(-3.65,.008,z,.65,.025,1.5,steel);
  for(let j=0;j<6;j++)
    box(-3.65,.026,z-.6+j*.24,.56,.015,.06,dark);
}

// Reusable neon sign texture.
function sign(text, subtitle, x,y,z,w,h,color,rotation=0) {
  const canvas = document.createElement("canvas");
  canvas.width=1024;
  canvas.height=256;
  const c=canvas.getContext("2d");
  c.fillStyle="#070e18";
  c.fillRect(0,0,1024,256);
  c.strokeStyle=color;
  c.lineWidth=8;
  c.strokeRect(8,8,1008,240);
  c.textAlign="center";
  c.shadowColor=color;
  c.shadowBlur=14;
  c.fillStyle=color;
  c.font="900 108px sans-serif";
  c.fillText(text,512,137);
  c.shadowBlur=0;
  c.font="26px monospace";
  c.fillStyle="#d4e9f0";
  c.fillText(subtitle,512,211);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.MeshBasicMaterial({
    map:texture,
    color:new THREE.Color().setRGB(1.8,1.8,1.8),
    side:THREE.DoubleSide
  });
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  mesh.position.set(x,y,z);
  mesh.rotation.y=rotation;
  scene.add(mesh);
  return mesh;
}

// Windows are instanced to keep the draw-call count lower.
const windows = [];
const names = [
  ["NOODLE LAB","HOT FOOD / OPEN ALL NIGHT"],
  ["HOTEL 09","SLEEP PODS / VACANCY"],
  ["SYNAPSE","MEMORY REPAIR / WALK IN"],
  ["AFTERLIFE","MUSIC / DRINKS / NO SIGNAL"],
  ["NIGHT MARKET","SECTOR 07 / LOCAL GOODS"],
  ["ARCADE","INSERT COIN / ESCAPE REALITY"]
];

for(let i=0;i<13;i++) {
  const z=12-i*8.5;
  for(const side of [-1,1]) {
    const height=rand(15,34);
    const mat=material(side===-1 ? "#172631" : "#25232e");
    box(side*8.1,height/2,z,5,height,8.2,mat);

    // Storefronts, shutters and awnings.
    box(side*5.54,2,z,.15,3.6,6.8,dark);
    box(side*5.13,3.9,z,1.1,.18,7,steel);
    for(let k=0;k<7;k++)
      box(side*5.43,.45+k*.4,z,.08,.045,6.3,steel);

    // Structural vertical strips.
    box(side*5.47,height/2,z-3.8,.18,height,.22,steel);

    for(let floor=5;floor<height-1;floor+=2.3) {
      for(let k=0;k<3;k++) {
        if(Math.random()<.28) continue;
        windows.push({
          x:side*5.57,y:floor,z:z-2.6+k*2.5,
          color:Math.random()<.28 ? "#ffb37b" : "#6ec5d9"
        });
      }
    }

    if(i%2===0) {
      const label=names[(i+(side===1?1:0))%names.length];
      sign(label[0],label[1],side*5.37,4.9,z,5.8,1.45,
        side===1 ? "#ff50b6" : "#42eeff",
        side===1 ? -Math.PI/2 : Math.PI/2);
    }

    // Air-conditioning units.
    if(i%2===1) {
      box(side*5.15,6.5,z,1,.85,1.5,steel);
      box(side*4.62,6.5,z,.02,.6,1.15,dark);
    }
  }
}

const winMat = new THREE.MeshBasicMaterial();
const winMesh = new THREE.InstancedMesh(cube,winMat,windows.length);
const dummy = new THREE.Object3D();
windows.forEach((w,i)=>{
  dummy.position.set(w.x,w.y,w.z);
  dummy.scale.set(.035,.85,1.15);
  dummy.updateMatrix();
  winMesh.setMatrixAt(i,dummy.matrix);
  winMesh.setColorAt(i,new THREE.Color(w.color).multiplyScalar(1.6));
});
winMesh.instanceMatrix.needsUpdate=true;
scene.add(winMesh);

// Distant towers closing the skyline, not the walking space.
for(let i=0;i<14;i++) {
  const h=rand(25,65);
  box(rand(-32,32),h/2,-113-rand(0,15),rand(3,7),h,5,concrete);
}

// Overhead walkways.
for(const z of [-16,-56,-87]) {
  box(0,8.5,z,11.5,.5,2.2,steel);
  box(0,10.3,z,11.5,.3,2.4,dark);
  for(let x=-5;x<=5;x+=1)
    box(x,9.4,z+.98,.08,1.6,.08,steel);
  box(0,8.25,z+1.12,10,.055,.07,cyan);
}
sign("NEON DISTRICT","WELCOME TO SECTOR 07",0,7.1,-17,7,1.7,"#42eeff");
sign("NO SIGNAL","BEYOND THIS POINT",0,6,-93,5.5,1.5,"#ff50b6");

// Sagging overhead cables.
for(let i=0;i<16;i++) {
  const z=10-i*6.6;
  pipe([[-5.6,12,z],[-2,10.5,z+.6],[2,10.1,z-.3],[5.6,13,z]],.025,dark);
}
for(const side of [-1,1]) {
  pipe([[side*5.28,.2,15],[side*5.28,7,15],
        [side*5.28,7,-95]],.095,steel);
}

// Benches, bins, vending machines and small barriers.
for(let i=0;i<8;i++) {
  const z=4-i*13;
  const side=i%2 ? -1 : 1;

  box(side*4.85,1.25,z,1.05,2.5,1.15,steel,true);
  box(side*4.85,1.53,z+.59,.78,1.4,.035,i%2?cyan:pink);
  box(side*4.85,.43,z+.61,.7,.25,.04,dark);
  sign("24H","DRINK / RECHARGE",side*4.85,2.83,z+.62,
       1.2,.4,i%2?"#42eeff":"#ff50b6");

  const bx=-side*4.7;
  box(bx,.5,z-3,1.1,.18,2.2,steel,true);
  box(bx-side*.43,.95,z-3,.15,.95,2.2,concrete);
  box(bx,.23,z-3.8,.65,.46,.15,dark);
  box(bx,.23,z-2.2,.65,.46,.15,dark);

  box(side*4.8,.42,z-5,.65,.84,.65,concrete,true);
}

// Main neon fixtures and limited local lights.
for(let i=0;i<5;i++) {
  const z=7-i*23;
  const side=i%2 ? -1 : 1;
  box(side*4.95,3.2,z,.08,2.4,.08,i%2?cyan:pink);
  const light=new THREE.PointLight(i%2?0x26dbff:0xff309a,36,15,2);
  light.position.set(side*3.8,3.2,z);
  scene.add(light);
}

// End barrier.
box(0,1.2,-99,11.4,2.4,.5,steel);
sign("END OF SECTOR","TURN BACK / CITY UNDER CONSTRUCTION",
     0,2.4,-98.7,5,1.25,"#ffc278");

// Rain as short line segments.
const rainCount=mobile?550:1300;
const rainArray=new Float32Array(rainCount*6);
for(let i=0;i<rainCount;i++) {
  const n=i*6;
  rainArray[n]=rand(-5.4,5.4);
  rainArray[n+1]=rand(0,22);
  rainArray[n+2]=rand(-100,20);
  rainArray[n+3]=rainArray[n]+.025;
  rainArray[n+4]=rainArray[n+1]-.22;
  rainArray[n+5]=rainArray[n+2];
}
const rainGeo=new THREE.BufferGeometry();
rainGeo.setAttribute("position",new THREE.BufferAttribute(rainArray,3));
const rain=new THREE.LineSegments(rainGeo,
  new THREE.LineBasicMaterial({
    color:"#8fb6ca",transparent:true,opacity:.3,depthWrite:false
  })
);
rain.frustumCulled=false;
scene.add(rain);

// Walking controls.
const keys={};
let started=false;
let yaw=0, pitch=0, walkingTime=0;
let drag=null;

function clearKeys(){
  for(const k in keys) delete keys[k];
}
function look(dx,dy){
  yaw-=dx*.0022;
  pitch=THREE.MathUtils.clamp(pitch-dy*.0022,-1.35,1.35);
}
function setCameraRotation(){
  camera.rotation.set(pitch,yaw,0);
}
async function enter(){
  started=true;
  $("#overlay").style.display="none";
  if(!mobile && renderer.domElement.requestPointerLock) {
    try {
      await renderer.domElement.requestPointerLock();
    } catch {
      $("#position").textContent="ลากเมาส์บนฉากเพื่อมอง / WASD เพื่อเดิน";
    }
  }
}
$("#start").onclick=enter;

document.addEventListener("pointerlockchange",()=>{
  clearKeys();
  if(!document.pointerLockElement && !mobile && started) {
    started=false;
    $("#overlay").style.display="grid";
    $("#start").textContent="กลับเข้าเมือง";
  }
});

document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement===renderer.domElement)
    look(e.movementX,e.movementY);
});

renderer.domElement.addEventListener("pointerdown",e=>{
  if(!started || document.pointerLockElement) return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY};
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
  if(!drag || drag.id!==e.pointerId) return;
  look(e.clientX-drag.x,e.clientY-drag.y);
  drag.x=e.clientX;
  drag.y=e.clientY;
});
function stopDrag(e){
  if(drag?.id===e.pointerId) drag=null;
}
renderer.domElement.addEventListener("pointerup",stopDrag);
renderer.domElement.addEventListener("pointercancel",stopDrag);

document.addEventListener("keydown",e=>{
  if(["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown",
      "ArrowLeft","ArrowRight","Space"].includes(e.code))
    e.preventDefault();
  if(started) keys[e.code]=true;
});
document.addEventListener("keyup",e=>{keys[e.code]=false});
addEventListener("blur",clearKeys);
document.addEventListener("visibilitychange",clearKeys);

document.querySelectorAll("[data-key]").forEach(button=>{
  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    if(!started) return;
    button.setPointerCapture(e.pointerId);
    keys[button.dataset.key]=true;
  });
  const release=()=>{keys[button.dataset.key]=false};
  button.addEventListener("pointerup",release);
  button.addEventListener("pointercancel",release);
  button.addEventListener("lostpointercapture",release);
});

$("#reset").onclick=()=>{
  camera.position.set(0,1.7,12);
  yaw=0;pitch=0;
  clearKeys();
};
$("#quality").onclick=()=>{
  bloom.enabled=!bloom.enabled;
  $("#quality").textContent=`แสง Bloom: ${bloom.enabled?"เปิด":"ปิด"}`;
};

function blocked(x,z){
  const r=.28;
  if(x < -5.25 || x > 5.25 || z < -97.8 || z > 18) return true;
  return obstacles.some(o=>
    x+r>o.x1 && x-r<o.x2 && z+r>o.z1 && z-r<o.z2
  );
}

let previous=performance.now();
function frame(now){
  const dt=Math.min((now-previous)/1000,.04);
  previous=now;

  if(started){
    let forward=Number(!!(keys.KeyW||keys.ArrowUp))-
                Number(!!(keys.KeyS||keys.ArrowDown));
    let side=Number(!!(keys.KeyD||keys.ArrowRight))-
             Number(!!(keys.KeyA||keys.ArrowLeft));
    const length=Math.hypot(forward,side);
    if(length){
      forward/=length;
      side/=length;
      const speed=(keys.ShiftLeft||keys.ShiftRight)?5.3:3;
      const dx=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt;
      const dz=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt;

      if(!blocked(camera.position.x+dx,camera.position.z))
        camera.position.x+=dx;
      if(!blocked(camera.position.x,camera.position.z+dz))
        camera.position.z+=dz;
      walkingTime+=dt*9;
      camera.position.y=1.7+Math.sin(walkingTime)*.025;
    }else{
      camera.position.y=THREE.MathUtils.lerp(camera.position.y,1.7,.1);
    }
  }
  setCameraRotation();

  for(let i=0;i<rainCount;i++){
    const n=i*6;
    rainArray[n+1]-=dt*11;
    if(rainArray[n+1]<0) rainArray[n+1]=22;
    rainArray[n+4]=rainArray[n+1]-.22;
  }
  rainGeo.attributes.position.needsUpdate=true;
  composer.render();
  requestAnimationFrame(frame);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

$("#start").disabled=false;
$("#start").textContent="เข้าเมือง";
$("#status").textContent=
  mobile ? "มือถือ: กดลูกศรเพื่อเดิน ลากบนฉากเพื่อมอง" :
           "คลิกเข้าเมืองเพื่อใช้เมาส์มองไปรอบ ๆ";
requestAnimationFrame(frame);
</script>
</body>
</html>
